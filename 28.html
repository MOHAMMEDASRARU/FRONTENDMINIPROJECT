<!DOCTYPE html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Marks Calculator</title><link rel=stylesheet href=../assets/s.css><div class=card><h2>Marks Calculator</h2><input id=a type=number placeholder="Subject 1"><input id=b type=number placeholder="Subject 2"><input id=c type=number placeholder="Subject 3"><button onclick="calc()">Calculate</button><p class=msg id=r></p></div><script>function calc(){var t=+a.value+ +b.value+ +c.value;r.textContent="Total: "+t+"  Average: "+(t/3).toFixed(2)}</script>
