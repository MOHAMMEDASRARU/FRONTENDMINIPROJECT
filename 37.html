<!DOCTYPE html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Student Search</title><link rel=stylesheet href=../assets/s.css><div class=card><input id=s placeholder="Enter student name"><p>Key pressed: <b id=k></b></p><p class=msg id=m></p></div><script>s.onkeydown=function(e){k.textContent=e.key;if(e.key=="Enter")m.textContent="Searching for student...";if(e.key=="Escape"){s.value="";m.textContent="";k.textContent=""}}</script>
