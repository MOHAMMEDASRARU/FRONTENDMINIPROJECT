<!DOCTYPE html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Symposium Validation</title><link rel=stylesheet href=../assets/s.css><form onsubmit="return v()"><h2>Symposium Registration</h2><label>Name</label><input id=n><label>Register Number</label><input id=r placeholder=REG123456><label>Email</label><input id=e><label>Mobile</label><input id=mo><label>Department</label><select id=d><option>CSE<option>ECE<option>IT</select>Skills: <input type=checkbox name=s value=C>C<input type=checkbox name=s value=Java>Java<input type=checkbox name=s value=Python>Python<br><button>Submit</button><p class="msg err" id=m></p><div id=t></div></form><script>function v(){var er=[];if(!/^[A-Za-z ]+$/.test(n.value))er.push("Name: alphabets and spaces only");if(!/^REG\d{6}$/.test(r.value))er.push("Register No: REG + 6 digits");if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.value))er.push("Invalid email");if(!/^\d{10}$/.test(mo.value))er.push("Mobile: exactly 10 digits");m.innerHTML=er.join("<br>");t.innerHTML="";if(!er.length){var sk=[];document.querySelectorAll("[name=s]:checked").forEach(function(x){sk.push(x.value)});m.className="msg ok";m.textContent="Registration confirmed!";t.innerHTML="<table><tr><th>Name<th>Department<th>Skills<tr><td>"+n.value+"<td>"+d.value+"<td>"+sk.join(", ")+"</table>"}else m.className="msg err";return false}</script>
