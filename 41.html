<!DOCTYPE html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Campus Image Viewer</title><link rel=stylesheet href=../assets/s.css><div class=card style="text-align:center"><h2>Campus Image Viewer</h2><img id=i src=../assets/campus1.svg width=360><p id=n class=msg></p><p>Left / Right arrows to navigate, Enter to select</p></div><script>var a=[],x=0;function show(){i.src="../assets/campus"+(x+1)+".svg";n.textContent=""}window.focus();document.onkeydown=function(e){if(e.key=="ArrowRight"){x=(x+1)%3;show()}if(e.key=="ArrowLeft"){x=(x+2)%3;show()}if(e.key=="Enter")n.textContent="Image Selected"}</script>
