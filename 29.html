<!DOCTYPE html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Login Validation</title><link rel=stylesheet href=../assets/s.css><form onsubmit="return v()"><h2>Student Login</h2><label>Username or Email</label><input id=u><label>Password</label><input id=p type=password><button>Login</button><p class=msg id=m></p></form><script>function v(){var e=/^([A-Za-z][A-Za-z0-9_]{3,15}|[^\s@]+@[^\s@]+\.[^\s@]+)$/,q=/^(?=.*[A-Za-z])(?=.*\d).{6,}$/;m.className="msg err";if(!u.value||!p.value)m.textContent="Username and password cannot be empty.";else if(!e.test(u.value))m.textContent="Invalid username/email.";else if(!q.test(p.value))m.textContent="Password: 6+ chars with letters and digits.";else{m.className="msg ok";m.textContent="Login successful!"}return false}</script>
