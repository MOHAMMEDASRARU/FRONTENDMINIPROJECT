<!DOCTYPE html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Traffic Signal</title><div style="width:90px;margin:20px auto;background:#222;padding:10px;border-radius:14px"><div class=l data-c=red data-m=STOP></div><div class=l data-c=gold data-m=READY></div><div class=l data-c=limegreen data-m=GO></div></div><h1 id=m style="text-align:center"></h1><style>.l{width:70px;height:70px;border-radius:50%;background:#555;margin:10px auto}</style><script>document.querySelectorAll(".l").forEach(function(l){l.onmouseover=function(){l.style.background=l.dataset.c;m.textContent=l.dataset.m;m.style.color=l.dataset.c};l.onmouseout=function(){l.style.background="";m.textContent=""}})</script>
