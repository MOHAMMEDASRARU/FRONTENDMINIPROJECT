<!DOCTYPE html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ATM PIN Entry</title><link rel=stylesheet href=../assets/s.css><div class=card><h2>Enter PIN</h2><input id=p type=password maxlength=4><p class=msg id=m></p></div><script>p.onkeydown=function(e){if(e.key=="Enter"){m.textContent="PIN Submitted Successfully";return}m.textContent="PIN Entry Started";if(e.key.length==1&&!/\d/.test(e.key)){e.preventDefault();m.textContent="Warning: numbers only!"}}</script>
