<!DOCTYPE html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Colour Box</title><div id=b style="width:150px;height:150px;background:blue;cursor:pointer"></div><p id=m></p><script>var c=["blue","red","green","orange","purple"],i=0;b.onclick=function(){i=(i+1)%c.length;b.style.background=c[i]};b.onmouseover=function(){m.textContent="Mouse is over the box"};b.onmouseout=function(){m.textContent=""}</script>
